name: Mintlify Deployment Preview Links

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: write
  issues: write
  deployments: read

concurrency:
  group: mintlify-preview-${{ github.event.deployment.ref }}
  cancel-in-progress: true

jobs:
  update-preview-links:
    # Only run when Mintlify deployment succeeds
    if: |
      github.event.deployment_status.state == 'success' && 
      github.event.deployment.environment == 'staging' &&
      contains(github.event.deployment_status.creator.login, 'mintlify')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.deployment.ref }}

      - name: Get PR number from deployment ref
        id: get-pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // The deployment ref is the branch name
            const branch = context.payload.deployment.ref;
            const deploymentSha = context.payload.deployment.sha;
            
            // Find PRs for this branch (check all states to detect recently merged)
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'all',
              sort: 'updated',
              direction: 'desc',
              per_page: 1
            });
            
            if (prs.data.length > 0) {
              const pr = prs.data[0];
              
              // Check if PR is already closed - preview likely torn down
              if (pr.state === 'closed') {
                core.warning(`PR #${pr.number} is already ${pr.merged_at ? 'merged' : 'closed'}. Preview likely torn down. Skipping comment update.`);
                core.setOutput('skip_update', 'true');
                return null;
              }
              
              // Check if this deployment is for the latest commit in the PR
              const prHeadSha = pr.head.sha;
              if (deploymentSha !== prHeadSha) {
                core.warning(`Deployment SHA (${deploymentSha}) doesn't match PR head SHA (${prHeadSha})`);
                core.warning(`This appears to be a deployment for an older commit. Skipping update.`);
                core.setOutput('skip_update', 'true');
                return null;
              }
              
              core.setOutput('pr_number', pr.number);
              core.setOutput('base_ref', pr.base.ref);
              core.setOutput('base_sha', pr.base.sha);
              core.setOutput('skip_update', 'false');
              core.info(`Found open PR #${pr.number} for branch ${branch}`);
              core.info(`Base branch: ${pr.base.ref} (${pr.base.sha})`);
              core.info(`Deployment SHA matches PR head: ${deploymentSha}`);
              return pr.number;
            } else {
              core.warning(`No PR found for branch ${branch}`);
              core.setOutput('skip_update', 'true');
              return null;
            }

      - name: Get all PR changed files
        if: steps.get-pr.outputs.pr_number && steps.get-pr.outputs.skip_update != 'true'
        id: changed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const prNumber = parseInt('${{ steps.get-pr.outputs.pr_number }}');
            
            // Get all files changed in the PR
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });
            
            // Filter for relevant file types
            const relevantFiles = files.filter(file => {
              const filename = file.filename;
              return filename.endsWith('.mdx') || 
                     filename.endsWith('.md') || 
                     filename === 'docs.json' || 
                     filename === 'mint.json' ||
                     filename.startsWith('snippets/') ||
                     filename.startsWith('images/') ||
                     filename.startsWith('icons/') ||
                     filename.startsWith('logo/') ||
                     filename.startsWith('static/') ||
                     filename === 'style.css';
            });
            
            // Group files by status - include diff stats (additions/deletions) for each file,
            // and previous_filename for renamed files.
            const toEntry = f => ({
              path: f.filename,
              additions: f.additions || 0,
              deletions: f.deletions || 0,
            });
            const added = relevantFiles.filter(f => f.status === 'added').map(toEntry);
            const modified = relevantFiles.filter(f => f.status === 'modified').map(toEntry);
            const removed = relevantFiles.filter(f => f.status === 'removed').map(toEntry);
            const renamed = relevantFiles.filter(f => f.status === 'renamed').map(f => ({
              old: f.previous_filename,
              new: f.filename,
              additions: f.additions || 0,
              deletions: f.deletions || 0,
            }));
            
            // Store all categorized files for the comment builder
            core.setOutput('added_files', JSON.stringify(added));
            core.setOutput('modified_files', JSON.stringify(modified));
            core.setOutput('removed_files', JSON.stringify(removed));
            core.setOutput('renamed_files', JSON.stringify(renamed));
            core.setOutput('any_changed', relevantFiles.length > 0 ? 'true' : 'false');
            
            core.info(`Found ${relevantFiles.length} changed files in PR #${prNumber}`);
            core.info(`Added: ${added.length}, Modified: ${modified.length}, Renamed: ${renamed.length}, Removed: ${removed.length}`);

      - name: Update PR comment with preview links
        if: steps.get-pr.outputs.pr_number && steps.get-pr.outputs.skip_update != 'true' && steps.changed.outputs.any_changed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
          ADDED_FILES: ${{ steps.changed.outputs.added_files }}
          MODIFIED_FILES: ${{ steps.changed.outputs.modified_files }}
          REMOVED_FILES: ${{ steps.changed.outputs.removed_files }}
          RENAMED_FILES: ${{ steps.changed.outputs.renamed_files }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const prNumber = parseInt(process.env.PR_NUMBER);
            const previewUrl = process.env.PREVIEW_URL;
            
            // Parse the categorized files
            const added = JSON.parse(process.env.ADDED_FILES || '[]');
            const modified = JSON.parse(process.env.MODIFIED_FILES || '[]');
            const removed = JSON.parse(process.env.REMOVED_FILES || '[]');
            const renamed = JSON.parse(process.env.RENAMED_FILES || '[]');
            
            if (!previewUrl) {
              core.warning('No preview URL found in deployment status');
              return;
            }
            
            const totalFiles = added.length + modified.length + removed.length + renamed.length;
            core.info(`Mintlify Preview URL: ${previewUrl}`);
            core.info(`Total changed files: ${totalFiles}`);
            core.info(`Added: ${added.length}, Modified: ${modified.length}, Renamed: ${renamed.length}, Removed: ${removed.length}`);
            
            // Mintlify page previews only apply to published .mdx routes (not plain .md or scripts/).
            function isDocPageWithPreview(filepath) {
              if (filepath.startsWith('scripts/')) return false;
              if (filepath.endsWith('.md')) return false;
              return filepath.endsWith('.mdx');
            }
            
            // Helper function to detect if a file is an image
            function isImageFile(filepath) {
              const imageExtensions = ['.png', '.jpg', '.jpeg', '.gif', '.svg', '.webp', '.ico', '.bmp'];
              const ext = path.extname(filepath).toLowerCase();
              if (imageExtensions.includes(ext)) return true;
              
              // Also check if it's in an image-related directory
              return filepath.startsWith('images/') || 
                     filepath.startsWith('icons/') || 
                     filepath.startsWith('logo/') || 
                     filepath.startsWith('static/');
            }
            
            // Function to get title from file path
            function titleFromPath(p) {
              let base = path.basename(p, path.extname(p));
              
              // Handle special icon naming pattern
              if (base.includes('Name=') || base.includes('Mode=')) {
                const nameMatch = base.match(/Name=([^,\s]+)/);
                const modeMatch = base.match(/Mode=([^,\s]+)/);
                
                if (nameMatch || modeMatch) {
                  const parts = [];
                  if (nameMatch) parts.push(nameMatch[1]);
                  if (modeMatch) parts.push(modeMatch[1]);
                  base = parts.join(' ');
                }
              }
              
              if (base === 'index') {
                const dir = path.dirname(p);
                const parent = path.basename(dir);
                return parent.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
              }
              return base.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            }
            
            // Function to get URL from file path
            function urlFromPath(p) {
              // Remove file extension
              let urlPath = p.replace(/\.(mdx?|md)$/, '');
              
              // Remove 'index' from the end if present
              if (urlPath.endsWith('/index')) {
                urlPath = urlPath.slice(0, -6);
              }
              
              return `${previewUrl}/${urlPath}`;
            }
            
            // Delimited block markers so our content can live inside Mintlify's deploy comment.
            const START = '<!-- wandb-preview-links:start -->';
            const END = '<!-- wandb-preview-links:end -->';

            // Build the previewable doc-page rows for the main table, grouped and ordered
            // Added -> Changed (modified) -> Renamed, alphabetical within each group.
            const byPath = (a, b) => a.path.localeCompare(b.path);
            const addedPages = added
              .filter(f => isDocPageWithPreview(f.path))
              .map(f => ({ path: f.path, action: 'Added', additions: f.additions, deletions: f.deletions }))
              .sort(byPath);
            const changedPages = modified
              .filter(f => isDocPageWithPreview(f.path))
              .map(f => ({ path: f.path, action: 'Changed', additions: f.additions, deletions: f.deletions }))
              .sort(byPath);
            const renamedPages = renamed
              .filter(r => isDocPageWithPreview(r.new))
              .map(r => ({ path: r.new, action: 'Renamed', additions: r.additions, deletions: r.deletions }))
              .sort(byPath);
            const pageRows = [...addedPages, ...changedPages, ...renamedPages];

            // Everything that can never have a preview: deleted doc pages plus all non-page files
            // (docs.json, images, icons, logo, static, style.css, other). Rendered as a collapsed table.
            const noPreview = [];
            const seenNoPreview = new Set();
            const addNoPreview = (p, action, additions, deletions) => {
              if (!p || seenNoPreview.has(p)) return;
              seenNoPreview.add(p);
              noPreview.push({ path: p, action, additions, deletions });
            };
            removed.filter(f => isDocPageWithPreview(f.path)).forEach(f => addNoPreview(f.path, 'Deleted', f.additions, f.deletions));
            added.filter(f => !isDocPageWithPreview(f.path)).forEach(f => addNoPreview(f.path, 'Added', f.additions, f.deletions));
            modified.filter(f => !isDocPageWithPreview(f.path)).forEach(f => addNoPreview(f.path, 'Changed', f.additions, f.deletions));
            removed.filter(f => !isDocPageWithPreview(f.path)).forEach(f => addNoPreview(f.path, 'Deleted', f.additions, f.deletions));
            renamed.filter(r => !isDocPageWithPreview(r.new)).forEach(r => addNoPreview(r.new, 'Renamed', r.additions, r.deletions));
            noPreview.sort(byPath);

            // Deployment identity for the footer, stable per deployment so the no-op guard is meaningful.
            const shortSha = context.payload.deployment.sha.substring(0, 7);
            const deployTs = (context.payload.deployment_status && context.payload.deployment_status.created_at)
              ? context.payload.deployment_status.created_at
              : new Date().toISOString();
            const timestamp = new Date(deployTs).toISOString().replace('T', ' ').split('.')[0] + ' UTC';

            // Build the slim, delimited preview-links block.
            const MAX_ROWS = 15;
            let block = `${START}\n`;
            block += `**📄 [Preview this PR's docs](${previewUrl})** · \`${shortSha}\`\n`;

            if (pageRows.length > 0) {
              block += `\n| Page | Change |\n| --- | --- |\n`;
              pageRows.slice(0, MAX_ROWS).forEach(row => {
                block += `| ${titleFromPath(row.path)} | [${row.action}](${urlFromPath(row.path)}) · +${row.additions} −${row.deletions} |\n`;
              });
              if (pageRows.length > MAX_ROWS) {
                block += `| … and ${pageRows.length - MAX_ROWS} more | |\n`;
              }
            }

            if (noPreview.length > 0) {
              block += `\n<details><summary>No preview available (${noPreview.length})</summary>\n\n`;
              block += `| File | Change |\n| --- | --- |\n`;
              noPreview.slice(0, MAX_ROWS).forEach(row => {
                let change;
                if (row.action === 'Added') change = `Added · +${row.additions}`;
                else if (row.action === 'Deleted') change = `Deleted · −${row.deletions}`;
                else change = `${row.action} · +${row.additions} −${row.deletions}`;
                block += `| \`${row.path}\` | ${change} |\n`;
              });
              if (noPreview.length > MAX_ROWS) {
                block += `| … and ${noPreview.length - MAX_ROWS} more | |\n`;
              }
              block += `\n</details>\n`;
            }

            block += `\n<sub>Updated ${timestamp} for deployment.</sub>\n`;
            block += END;

            // Fetch all comments on the PR.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            // Extract the existing wandb block (between start/end markers) from a comment body.
            const blockRe = /<!-- wandb-preview-links:start -->[\s\S]*?<!-- wandb-preview-links:end -->/;
            const extractBlock = body => {
              if (!body) return null;
              const m = body.match(blockRe);
              return m ? m[0] : null;
            };

            // Mintlify's own deploy comment (a Bot whose login matches /mintlify/i).
            const mintlifyComment = comments.find(c => c.user && c.user.type === 'Bot' && /mintlify/i.test(c.user.login));
            // Any legacy standalone comment previously posted by this workflow (github-actions[bot]).
            let legacyComment = comments.find(c => c.body && (c.body.includes('<!-- wandb-preview-links:start -->') || c.body.includes('<!-- mintlify-preview-links -->')) && c.user && c.user.type === 'Bot' && /github-actions/i.test(c.user.login));

            // Delete a redundant legacy standalone comment. Only meaningful in the merge path,
            // where the Mintlify comment is the single home for our block; clears the reference
            // so the fallback below won't try to reuse a now-deleted comment.
            const deleteLegacyComment = async () => {
              if (!legacyComment || (mintlifyComment && legacyComment.id === mintlifyComment.id)) return;
              try {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: legacyComment.id,
                });
                core.info(`Deleted legacy standalone comment #${legacyComment.id}`);
              } catch (e) {
                core.warning(`Failed to delete legacy comment #${legacyComment.id}: ${e.message}`);
              }
              legacyComment = null;
            };

            // In the merge path (a Mintlify comment exists), any separate standalone comment of
            // ours is redundant. Remove it BEFORE the no-op guard so cleanup happens even when the
            // preview-links block is unchanged and the update is skipped below.
            if (mintlifyComment) {
              await deleteLegacyComment();
            }

            // No-op guard: if the target comment already carries an identical block, skip the write.
            const targetComment = mintlifyComment || legacyComment;
            const existingBlock = targetComment ? extractBlock(targetComment.body) : null;
            if (existingBlock !== null && existingBlock === block) {
              console.log('Preview-links block unchanged; skipping update.');
              return;
            }

            let merged = false;
            if (mintlifyComment) {
              try {
                // Strip any prior wandb block (with its leading separator) from Mintlify's comment, then append ours.
                let newBody = mintlifyComment.body || '';
                newBody = newBody.replace(/\n*\n---\n+<!-- wandb-preview-links:start -->[\s\S]*?<!-- wandb-preview-links:end -->/, '');
                newBody = newBody.replace(/\n*<!-- wandb-preview-links:start -->[\s\S]*?<!-- wandb-preview-links:end -->/, '');
                newBody = newBody.replace(/\s+$/, '');
                newBody = `${newBody}\n\n---\n\n${block}`;
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: mintlifyComment.id,
                  body: newBody,
                });
                core.info(`Merged preview links into Mintlify comment #${mintlifyComment.id}`);
                merged = true;
              } catch (e) {
                core.warning(`Failed to merge into Mintlify comment: ${e.message}. Falling back to a standalone comment.`);
                merged = false;
              }
            }

            if (!merged) {
              // Fallback: upsert our own standalone comment, found by the start marker.
              if (legacyComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: legacyComment.id,
                  body: block,
                });
                core.info(`Updated standalone preview-links comment #${legacyComment.id}`);
              } else {
                const newComment = await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: block,
                });
                core.info(`Created standalone preview-links comment #${newComment.data.id}`);
              }
            }
